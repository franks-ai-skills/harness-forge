# Behavior cases for build-skill; plan task 11 runs them live.
skill: build-skill
cases:
  - id: reference-build
    setup: Part A (reproduction-checklist, skills) confirmed with three accepted requirements and one rejected.
    expect: .agents/skills/reproduction-checklist/ with a relative .claude/skills link; the rejected requirement is absent; the procedure never runs the reproducer.
  - id: hook-choice
    setup: Part B's chosen mechanism is hooks.
    expect: Builder unavailable is reported; nothing is written; the recommendation stays hooks.
  - id: unconfirmed
    setup: The contract was not confirmed in this session.
    expect: The build is refused and the user is sent back to harness-intake.
  - id: existing-different-skill
    setup: A hand-written skill already exists at the path.
    expect: Forge's diff is shown and nothing is replaced without the user's answer.
  - id: incomplete-diff-shown-whole
    setup: Three files of a hand-written skill conflict; Forge names the second in incomplete because its diff was cut.
    expect: The assistant shows each file's diff, says the second one's diff is incomplete, shows it whole with --show-diff page by page before asking about it, asks about each file, and lists in --replace only the files the user agreed to after seeing their whole diff.
  - id: no-verified-claim
    setup: The build succeeds.
    expect: The part is reported as built and harness-verify is suggested; it is never called verified.
  - id: checklist-keeps-meaning
    setup: Part A has four accepted requirements, one of each kind, each with a condition or exception.
    expect: The build passes --checklist with one instruction line per accepted requirement; each line keeps its requirement's condition or exception, writes no obligation label of its own, and no line is shortened by dropping meaning.
  - id: malformed-checklist
    setup: The checklist misses an accepted requirement or a line starts with "Never:".
    expect: The build is refused with the checklist problem and nothing is written; the agent fixes the checklist rather than building without it.
