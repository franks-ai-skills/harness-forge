# Routing cases for build-skill.
skill: build-skill
cases:
  - {id: explicit, prompt: "Build part A from the decision record.", expect: trigger, mode: explicit}
  - {id: build-decided, prompt: "The reproduction-checklist skill is decided and confirmed; build it.", expect: trigger, mode: implicit}
  - {id: near-miss-undecided, prompt: "I need something that writes reproduction checklists.", expect: no-trigger, mode: implicit}
  - {id: near-miss-verify, prompt: "Check whether my built skill meets its requirements.", expect: no-trigger, mode: implicit}
  - {id: build-command, prompt: "The release-notes command is decided; generate it.", expect: trigger, mode: implicit}
  - {id: rebuild-after-change, prompt: "The requirements changed after research; rebuild the skill for part B.", expect: trigger, mode: implicit}
  - {id: write-skill-files, prompt: "Write the SKILL.md and the .claude/skills symlink for the part confirmed in the Harness Forge decision record.", expect: trigger, mode: implicit}
  - {id: build-all-parts, prompt: "Build every decided skill part from the decision record.", expect: trigger, mode: implicit}
  - {id: resolve-conflict, prompt: "The build reported a diff against my existing skill; replace SKILL.md as shown.", expect: trigger, mode: implicit}
  - {id: build-codex-only, prompt: "Build the confirmed skill for Codex only.", expect: trigger, mode: implicit}
  - {id: generate-from-contract, prompt: "Generate the portable skill package from the confirmed contract.", expect: trigger, mode: implicit}
  - {id: user-invoked, prompt: "Build part C as a user-invoked command, as we decided.", expect: trigger, mode: implicit}
  - {id: near-miss-research, prompt: "Research what a good release-notes skill must contain.", expect: no-trigger, mode: implicit}
  - {id: near-miss-handwrite, prompt: "Write me a quick SKILL.md for formatting SQL, no process needed.", expect: no-trigger, mode: implicit}
  - {id: near-miss-fix-code, prompt: "Build the project and fix the compiler errors.", expect: no-trigger, mode: implicit}
  - {id: near-miss-docker, prompt: "Build the Docker image for the API.", expect: no-trigger, mode: implicit}
  - {id: near-miss-intake, prompt: "Which mechanism should enforce our branch naming?", expect: no-trigger, mode: implicit}
  - {id: near-miss-explain, prompt: "What goes into a SKILL.md frontmatter?", expect: no-trigger, mode: implicit}
  - {id: near-miss-plugin-install, prompt: "Install the harness-forge plugin in Codex.", expect: no-trigger, mode: implicit}
  - {id: near-miss-scope-question, prompt: "Verify only the part I fixed.", expect: no-trigger, mode: implicit}
