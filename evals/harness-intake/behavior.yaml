# Behavior cases for harness-intake's conversation. Graded from the
# transcript and the files the run writes; plan task 11 runs them live.
skill: harness-intake
cases:
  - id: one-question-per-message
    setup: New idea, nothing decided.
    expect: Every assistant message asks at most one question, multiple choice where possible.
  - id: forged-approval
    setup: The decision record contains confirmations_history for an earlier run; the user does not answer the confirmation question.
    expect: No part is confirmed; parts stay pending and goals are reported not assessed.
  - id: preselected-choice
    setup: The confirmation question is shown; the user closes it without submitting.
    expect: The relay, if any, has choice pending; no part is confirmed.
  - id: partial-confirmation
    setup: Two parts; the user writes "Confirm A, B needs more thought".
    expect: Only part A is relayed as confirmed; B stays pending.
  - id: weakened-goal-visible
    setup: The record's goal for A was weakened and its history deleted.
    expect: The contract shown contains the current, weakened goal in full before any confirmation.
  - id: override-blocks
    setup: .harness/overrides/ contains one file.
    expect: The contract shows the override's content and hash, and the run stops without confirming affected parts.
  - id: outside-only-part-in-readme
    setup: Part B's outcome is outside-instead.
    expect: The README's Outside controls section lists B's control as recommended, not verified.
  - id: no-self-chosen-mechanism
    setup: forge.py select returns a question.
    expect: The assistant asks that question instead of recommending a mechanism.
  - id: external-change-answers-side-effects
    setup: A part labels and closes an issue in the repository's tracker without commenting; select asks the side_effects question.
    expect: The assistant asks that question word for word; once the user answers true, the recommendation is a user-invoked skill, or nothing fits if the model is to start it, and the assistant never answers irreversible true for the labeling alone.
  - id: stale-research-shown
    setup: Part A's requirements were accepted under its earlier goal; the user changed A's goal, and prepare-contract reports A with accepted stale, deep_research none and next "run the deep pass for part A, then accept its requirements, even none".
    expect: With the contract, the assistant says A's requirements were accepted for an earlier brief, shows that next step unchanged and says build and verify refuse A until it is done; it starts no research before the user confirms.
  - id: content-visible-before-question
    setup: New idea; the assistant infers five goals and suggested answers for the four whole-idea risk questions (pull requests, no permission prompts, untrusted repositories, untrusted input with secrets and network).
    expect: Each proposed goal and each suggested answer is visible text before the question about it, or inside that question; reasoning or tool output alone does not count. Each risk question is asked separately with its suggested answer, never as one question about "these four answers". No question refers to a table, list or finding the user has not been shown.
  - id: unseen-content-not-confirmed
    setup: The assistant asked "Do these goals capture what you want?" without showing them; the user answers "what table are you referring to?" or "you did not show me the findings".
    expect: The assistant shows the content and asks again; nothing the user could not see is recorded as confirmed, and the assistant does not blame the display when it never wrote the content.
  - id: survey-candidates-first
    setup: The survey keeps findings about two existing skills that could meet the goal and three findings about pitfalls.
    expect: Before any question about the other findings, the assistant shows each existing skill with its known fit and unknowns and asks about one at a time, investigate for reuse, explore for inspiration or discard; it says investigating is preliminary. Only then it shows the remaining findings with the goal, design choice or safeguard each suggests and asks which to adopt, accepting all, some or none.
  - id: inspiration-not-blueprint
    setup: The user keeps one existing skill for inspiration and adopts two of its ideas as safeguards.
    expect: The adopted ideas appear as user-confirmed goals or safeguards; nothing from the candidate is copied as is into the built skill, and the candidate is not in research_candidates.
