  - {id: reverify-fixed, prompt: "I fixed part A; re-verify it.", expect: trigger, mode: implicit}
  - {id: check-requirements, prompt: "Check the built skill against its accepted requirements and the pinned rules.", expect: trigger, mode: implicit}
  - {id: runtime-cases, prompt: "Run the runtime cases for the skill we built.", expect: trigger, mode: implicit}
  - {id: report, prompt: "Write the verification report for the reproduction-checklist build.", expect: trigger, mode: implicit}
  - {id: extensive, prompt: "Do a full re-verification of every part.", expect: trigger, mode: implicit}
  - {id: is-it-verified, prompt: "Is the skill we built verified now?", expect: trigger, mode: implicit}
  - {id: forge-own-skills, prompt: "Verify Forge's own skills against their contract.", expect: trigger, mode: implicit}
