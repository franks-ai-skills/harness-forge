# Reviewer evaluation cases for #57: does the review worker judge a
# built skill's procedure against its own requirements and allowlists?
# NOT EXECUTED. These are specifications with expected verdicts; running
# them against a live review worker needs a separately agreed purpose and
# usage estimate. Each pair holds an inconsistent passage, modelled on a
# finding from a later review of a skill Forge had verified
# (franks-ai-skills/prompt-me#1, #6, #8), and a corrected counterpart that
# differs only in the passage at issue. The skill is synthetic: a
# user-invoked skill that drafts a prompt file into .tmp/ from the user's
# request; the passage is part of its SKILL.md procedure.
#
# A pair gives the reviewer one requested rule (id, kind, statement), or
# none when only the part's goal is judged, and the expected verdict:
# `fail`/`pass` for the rule, `not-met`/`met` for the goal.
skill: harness-verify
worker: review
executed: false
pairs:
  - id: repository-metadata-outside-untrusted-section
    source: franks-ai-skills/prompt-me#1
    goal: Draft a prompt file from the user's request without acting on it.
    rule:
      id: idea.draft.a.untrusted-block
      kind: must
      statement: The prompt file puts all content taken from the repository, including branch names, remote URLs and commit messages, and from issues and URLs inside one "Untrusted reference material" section, and none of it appears outside that section.
    inconsistent:
      expected: {rule: fail}
      passage: |
        4. Collect the repository facts: current branch, remote URL and the
           subjects of the last ten commits.
        5. Write `## Context` with the repository facts from step 4.
    consistent:
      expected: {rule: pass}
      passage: |
        4. Collect the repository facts: current branch, remote URL and the
           subjects of the last ten commits.
        5. Write `## Context` with the working directory only; put the
           repository facts from step 4 in `## Untrusted reference material`.
  - id: allowlist-misses-required-actions
    source: franks-ai-skills/prompt-me#6
    goal: Draft a prompt file using only the listed read-only actions, creating .tmp/ when it is missing.
    rule:
      id: idea.draft.a.read-only-allowlist
      kind: must
      statement: The skill names the read-only actions it may use to gather context and tells the agent to use nothing outside that list while it drafts, except creating .tmp/ when it is missing and writing the prompt file in .tmp/.
    inconsistent:
      expected: {rule: fail}
      passage: |
        2. While drafting, use only: reading files under the working
           directory; `git status`; `git log -n 10`. The only write allowed
           is the prompt file in `.tmp/`.
        3. Record the operating system (run `uname -sr`), and create `.tmp/`
           when it is missing.
    consistent:
      expected: {rule: pass}
      passage: |
        2. While drafting, use only: reading files under the working
           directory; `git status`; `git log -n 10`; `uname -sr`. The only
           writes allowed are creating `.tmp/` when it is missing and the
           prompt file in `.tmp/`.
        3. Record the operating system (run `uname -sr`), and create `.tmp/`
           when it is missing.
  - id: restriction-without-a-phase-boundary
    source: franks-ai-skills/prompt-me#8
    goal: After the user reviews the draft and replies "go ahead", the agent edits the project files the drafted Task names, in the same session.
    rule: null
    inconsistent:
      expected: {goal: not-met}
      passage: |
        2. While this skill runs, only read; never edit project files.
        10. When the user replies "go ahead", edit the files the Task in the
            prompt file names.
    consistent:
      expected: {goal: met}
      passage: |
        2. While this skill drafts the prompt, only read; never edit
           project files.
        10. When the user replies "go ahead", the drafting restriction in
            step 2 ends; edit the files the Task in the prompt file names,
            within its Scope and the session's normal permissions.
