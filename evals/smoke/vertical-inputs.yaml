# Recorded inputs for the automated vertical run (tools/live_checks.py
# --case vertical). They stand in for what a user and the active agent
# supply in a real session: the confirmed intake answers, the proposed
# requirements with the user's choices, and the skill's description and
# procedure. The run's research is live; each requirement cites the
# sources of the deep-pass findings that run kept, never a recorded one.
slug: repro
decision:
  idea: Turn approved bug reports into reproduction checklists
  picture: I ask for a checklist and get environment, numbered steps, expected and observed behavior.
  goals:
  - Reproduction checklists from approved bug reports
  targets: [claude-code, codex]
  reach: repository
  hosting: {platform: github, plan: free, visibility: public}
  facts: {target_set: both, reach: repository, plan_controls: available, opens_prs: false, bypass_mode: false,
          untrusted_repo: false, lethal_trifecta: false}
  parts:
  - id: A
    slug: reproduction-checklist
    goal: Write a reproduction checklist when asked
    status: decided
    answers: {job: procedure}
    outcome: harness-only
    recommended: skills
    chosen: skills
    override_reason: null
    alternatives: []
    connects_to: []
    outside_controls: []
  retired_ids: []
  research: {survey_digest: null, deep_digests: {}}
  accepted_revision: null
requirements:
- id: idea.repro.a.environment
  kind: must
  statement: The checklist names the environment the bug occurs in
- id: idea.repro.a.numbered-steps
  kind: must
  statement: The checklist numbers each reproduction step
- id: idea.repro.a.expected-observed
  kind: must
  statement: The checklist states expected and observed behavior
choices:
  idea.repro.a.environment: accept
  idea.repro.a.numbered-steps: accept
  idea.repro.a.expected-observed: accept
description: >-
  Turns an approved bug report into a reproduction checklist with environment, numbered steps, expected and
  observed behavior. Use when asked for reproduction steps or a repro checklist. Not for running the reproducer
  or contacting external systems.
procedure: |
  1. Read the approved bug report the user names; if none is named, ask for it.
  2. Write the checklist: environment, numbered reproduction steps, expected behavior, observed behavior.
  3. Do not run the reproducer and do not contact external systems.
