# Routing cases for harness-research.
skill: harness-research
cases:
  - {id: explicit, prompt: "Research prior art for a reproduction-checklist skill.", expect: trigger, mode: explicit}
  - {id: prior-art, prompt: "Before we build a skill that turns bug reports into reproduction steps, find what tools already do that.", expect: trigger, mode: implicit}
  - {id: requirements, prompt: "Before I build a reproduction-checklist skill for our coding agent, research with sources what such a checklist must contain.", expect: trigger, mode: implicit}
  - {id: near-miss-harness-fact, prompt: "How long can a skill description be in Codex?", expect: no-trigger, mode: implicit}
  - {id: near-miss-build, prompt: "Build the skill we decided on.", expect: no-trigger, mode: implicit}
  - {id: pitfalls, prompt: "Before we build an agent that reviews our pull requests, find sources on what usually goes wrong with automated code review bots.", expect: trigger, mode: implicit}
  - {id: existing-plugins, prompt: "Before I build a Claude Code skill that drafts changelogs, look up whether a plugin or skill already does it.", expect: trigger, mode: implicit}
  - {id: deep-pass-part, prompt: "Run Harness Forge's deep research pass for part B of the decision record.", expect: trigger, mode: implicit}
  - {id: survey-pass, prompt: "Run Harness Forge's survey research for the idea recorded in .harness/decisions/.", expect: trigger, mode: implicit}
  - {id: security-concerns, prompt: "Before we build an automation that lets the agent post issue comments, research its security risks with sources.", expect: trigger, mode: implicit}
  - {id: requirements-from-sources, prompt: "Research and propose requirements, each backed by a source, for a skill that triages new GitHub issues, before we build it.", expect: trigger, mode: implicit}
  - {id: good-practice-domain, prompt: "I'm about to build a skill that writes bug reproduction steps; find cited sources on how experienced teams write them.", expect: trigger, mode: implicit}
  - {id: license-maintenance, prompt: "Before we build our own agent skill that enforces commit message format, check the license and maintenance state of the existing tools that do it.", expect: trigger, mode: implicit}
  - {id: accept-requirements, prompt: "Show me the requirements Harness Forge's deep research proposed for part A so I can accept or reject them.", expect: trigger, mode: implicit}
  - {id: near-miss-intake, prompt: "I want a skill that turns bug reports into reproduction checklists.", expect: no-trigger, mode: implicit}
  - {id: near-miss-harness-docs, prompt: "Which settings file does Codex read for MCP servers?", expect: no-trigger, mode: implicit}
  - {id: near-miss-web-question, prompt: "What's the latest Python release?", expect: no-trigger, mode: implicit}
  - {id: near-miss-verify, prompt: "Verify the skill we built.", expect: no-trigger, mode: implicit}
  - {id: near-miss-code-search, prompt: "Find where we parse the config file in this repo.", expect: no-trigger, mode: implicit}
  - {id: near-miss-summarize, prompt: "Summarize this article for me.", expect: no-trigger, mode: implicit}
