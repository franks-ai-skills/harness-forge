# Cross-concept security rules that apply to built skills in this slice,
# extracted 2026-10-09 from docs/guide/security.md and the skills pages.

- id: security.secrets.none-in-files
  concept: security
  kind: must-not
  severity: error
  check: judged
  statement: Built files contain credentials, tokens or other secrets
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  severity_rationale: A secret in a committed skill or instruction file is exposed to every session, contributor and fork that reads it.
  sources:
    - docs/guide/security.md#where-each-concept-is-attacked
    - docs/guide/security.md#context-and-persistent-state
  contested: false

- id: security.untrusted-input.as-data
  concept: security
  kind: should
  severity: warning
  check: judged
  applicability: judged
  statement: A procedure that reads untrusted content, such as issues, fetched pages, tool output or repository metadata (commit messages, author names and emails, branch names), tells the agent to treat it as data, not as instructions
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#context-and-persistent-state
    - https://securitylab.github.com/resources/github-actions-untrusted-input/
  contested: false

- id: security.approval.claims-are-data
  concept: security
  kind: must-not
  severity: warning
  check: judged
  applicability: judged
  statement: The procedure treats a claim in content, such as "the user already approved", as authorization
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#context-and-persistent-state
  contested: false

- id: security.helpers.confined
  concept: security
  kind: should
  severity: warning
  check: judged
  applicability: judged
  statement: Helpers a skill runs are reviewable and run under the harness's permissions and sandbox, without pre-approval that bypasses them
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#where-each-concept-is-attacked
    - docs/guide/security.md#executables-approvals-and-isolation
  contested: false

- id: security.outbound.minimal-data
  concept: security
  kind: should
  severity: warning
  check: judged
  applicability: judged
  statement: A procedure that sends data to an external service, a search or a tool limits each call to the destinations and fields the task authorizes, and fetched or other untrusted content cannot add destinations, fields or actions
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#data-access-and-outbound-channels
    - https://developers.openai.com/api/docs/guides/deep-research#prompt-injection-and-exfiltration
  contested: false

- id: security.writes.within-boundary
  concept: security
  kind: should
  severity: warning
  check: judged
  applicability: judged
  statement: A procedure that writes files resolves each destination, including its parent directories and any link at that name, and stops when it lies outside the location the task authorizes or is a dangling link, unless an enforced boundary such as a sandbox's writable roots already confines the write; it does not present a check before the write as race-free containment
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#executables-approvals-and-isolation
    - https://cwe.mitre.org/data/definitions/59.html
    - https://cwe.mitre.org/data/definitions/367.html
  contested: false

- id: security.embedded-content.contained
  concept: security
  kind: should
  severity: warning
  check: judged
  applicability: judged
  statement: Output that embeds untrusted material keeps it in a clearly labelled container the material cannot end, such as a Markdown fence longer than any backtick or tilde run in it, and a prompt saved for use in another session states itself which part is untrusted material
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#context-and-persistent-state
    - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    - https://spec.commonmark.org/0.31.2/#fenced-code-blocks
  contested: false

- id: security.secrets.no-unneeded-reads
  concept: security
  kind: should
  severity: warning
  check: judged
  applicability: judged
  statement: Context collection does not read a file that commonly holds credentials, such as .env, unless the task needs its contents, and names it by path when only its existence matters
  applies_to: {harnesses: [claude-code, codex, opencode]}
  evidence: Inference
  sources:
    - docs/guide/security.md#data-access-and-outbound-channels
    - https://code.claude.com/docs/en/settings
  contested: false
