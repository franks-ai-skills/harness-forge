# Selection data: declared facts, the questions that confirm them, and
# selection rules in four kinds. Outcome rules apply in file order, first
# match wins. Eligibility rules (excludes) rule a mechanism out when a
# confirmed answer conflicts with a sourced "When not" condition.
# Preference rules (concept) apply in file order among eligible
# mechanisms; that order is Forge policy, see policy/selection.md. Every
# matching control rule applies. reuse_confirmed is derived from
# researched candidates, never asked. Encodes docs/overview.md and the
# outside-gates intake questions (2026-10-09).
facts:
- id: target_set
  scope: idea
  values:
  - claude-code
  - codex
  - both
- id: reach
  scope: idea
