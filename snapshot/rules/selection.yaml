questions:
- id: target_set
  text: 'Which harnesses should run the result: Claude Code, Codex or both?'
  choices:
  - claude-code
  - codex
  - both
- id: reach
  text: 'Who uses it: this repository, all of your repositories, or the public?'
  choices:
  - repository
  - user
  - public
- id: plan_controls
  text: Are merge rules and required checks available on your hosting plan for this repository's visibility?
  choices:
  - available
  - unavailable
  - unknown
- id: opens_prs
  text: Will an agent open pull requests as part of this idea?
  choices:
  - true
  - false
- id: bypass_mode
  text: Will the agent run in a bypass or no-prompt mode?
  choices:
  - true
  - false
- id: untrusted_repo
  text: Will the agent work in repositories you do not trust?
  choices:
  - true
  - false
- id: lethal_trifecta
  text: Does the agent combine untrusted input with access to secrets and outbound network access?
  choices:
  - true
  - false
- id: job
  text: 'What is this part''s one job: standing guidance, a procedure, a harness setting, allowing or refusing actions, access to an external system, a check at an event, delegating a task, bundling a setup
    for others, running without a person, or a one-step task?'
  choices:
  - guidance
  - procedure
  - setting
  - access-control
  - integration
  - check
  - delegate
  - bundle
  - run-unattended
  - one-step
- id: event_without_agent
  text: Does the event happen without an agent, such as a merge, deploy, publish or credential scope?
  choices:
  - true
  - false
- id: must_survive_compromise
  text: Must it still hold if the agent is prompt-injected or its configuration is changed by a pull request?
  choices:
  - required
  - not-required
- id: who_disables
  text: 'Who may turn it off: the agent, any contributor, or only an admin?'
  choices:
  - agent
  - contributor
  - admin
- id: every_time
  text: Must it hold every time, or may the agent occasionally skip it?
  choices:
  - always
  - usually
- id: irreversible
  text: Is the action irreversible, about money, or does it publish or disclose data?
  choices:
  - true
  - false
- id: early_feedback
  text: Do you want earlier feedback than an outside gate gives?
  choices:
  - true
  - false
- id: trigger
  text: 'Who starts it: the user, the model, or an event?'
  choices:
  - user
  - model
  - event
- id: own_context
  text: Does it need its own context, other tools or another model?
  choices:
  - true
  - false
- id: external_system
  text: Does it reach an external system, and does a CLI exist for it?
  choices:
  - none
  - cli
  - no-cli
- id: script_checkable
  text: Can a script decide it without judgment?
  choices:
  - true
  - false
rules:
- id: selection.outcome.reuse
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - reuse_confirmed
      - true
    implies:
      outcome: reuse
  statement: A researched existing solution with confirmed fit, license and maintenance is reused instead of built
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/skills.md#security
  - docs/best-practices/skills.md#security
  contested: false
- id: selection.outcome.one-step
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - one-step
    implies:
      outcome: nothing-fits
  statement: A one-step task the model handles alone needs no mechanism
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  - docs/guide/skills.md#when-to-use-it-and-when-not
  contested: false
- id: selection.outcome.guarantee-unavailable
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - any:
        - eq:
          - must_survive_compromise
          - required
        - eq:
          - who_disables
          - admin
        - eq:
          - event_without_agent
          - true
      - eq:
        - plan_controls
        - unavailable
    implies:
      outcome: nothing-fits
  statement: A guarantee that needs an outside control unavailable on the user's plan is reported as nothing fits
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  - docs/guide/outside-gates.md#seven-conditions-turn-a-control-into-a-gate
  contested: false
- id: selection.outcome.event-with-feedback
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - event_without_agent
        - true
      - eq:
        - early_feedback
        - true
    implies:
      outcome: outside-alongside
  statement: An event that happens without an agent needs an outside gate; wanted earlier feedback adds an advisory harness mirror
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.outcome.event-without-agent
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - event_without_agent
      - true
    implies:
      outcome: outside-instead
  statement: An event that happens without an agent is enforced by an outside gate; a harness build adds no enforcement
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.outcome.guarantee
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      any:
      - eq:
        - must_survive_compromise
        - required
      - eq:
        - who_disables
        - admin
      - eq:
        - irreversible
        - true
    implies:
      outcome: outside-alongside
  statement: A rule that must survive a compromised agent, that only an admin may turn off, or that guards an irreversible action needs an outside control alongside the harness mechanism
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.outcome.harness-only
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      in:
      - job
      - - guidance
        - procedure
        - setting
        - access-control
        - integration
        - check
        - delegate
        - bundle
        - run-unattended
    implies:
      outcome: harness-only
  statement: Otherwise a harness mechanism alone fits
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.eligibility.must-hold-instructions
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: instructions
  statement: Instructions cannot guarantee a rule that must hold every time; they are context, not enforcement
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#instructions
  contested: false
- id: selection.eligibility.must-hold-skills
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: skills
  statement: A skill cannot guarantee a rule that must hold every time
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  - docs/guide/skills.md#when-to-use-it-and-when-not
  contested: false
- id: selection.eligibility.must-hold-commands
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: commands
  statement: A user-invoked skill cannot guarantee a rule that must hold every time
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  contested: false
- id: selection.eligibility.must-hold-subagents
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: subagents
  statement: Delegation is a model decision, so a subagent cannot guarantee a check that must always run
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#subagents
  contested: false
- id: selection.eligibility.must-hold-automation
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: automation
  statement: Running the agent unattended does not make a rule hold on every tool call
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#automation
  contested: false
- id: selection.eligibility.judgment-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - script_checkable
      - false
    implies:
      excludes: hooks
  statement: A hook is a deterministic handler; work that needs judgment belongs in instructions or skills
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#hooks
  contested: false
- id: selection.eligibility.hard-limit-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - job
        - access-control
      - eq:
        - every_time
        - always
    implies:
      excludes: hooks
  statement: A hard limit on reading, writing or network access needs permissions and the sandbox; tool switching and unhooked paths bypass hooks
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#hooks
  contested: false
- id: selection.eligibility.model-started-commands
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - job
        - procedure
      - eq:
        - trigger
        - model
    implies:
      excludes: commands
  statement: A procedure the model should start on its own cannot be a user-invoked skill
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  contested: false
- id: selection.eligibility.side-effects-skills
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - irreversible
      - true
    implies:
      excludes: skills
  statement: The model must not decide on its own to run an irreversible or publishing procedure, so a model-invoked skill does not fit
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  - docs/guide/skills.md#user-invoked-skill
  contested: false
- id: selection.mechanism.early-feedback-mirror
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - event_without_agent
        - true
      - eq:
        - early_feedback
        - true
    implies:
      concept: hooks
    pros:
    - Runs every time, whatever the model decides
    - Gives feedback before the gate
    cons:
    - 'Advisory: the agent or a pull request can change it'
  statement: An advisory hook mirrors the outside gate's check for earlier feedback
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#hooks
  - docs/guide/hooks.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.must-hold-access
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - every_time
        - always
      - eq:
        - job
        - access-control
    implies:
      concept: permissions-and-sandbox
    pros:
    - A deny in any scope wins in both leads
    - The sandbox limits executed commands
    cons:
    - Confines shell commands only, not MCP servers or hooks
  statement: A capability that must never be used, or must be approved first, is a permission rule
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#permissions-and-sandbox
  - docs/guide/permissions-and-sandbox.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.must-hold-check
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - every_time
        - always
      - eq:
        - script_checkable
        - true
    implies:
      concept: hooks
    pros:
    - Runs every time, whatever the model decides
    cons:
    - Not a hard security limit
    - A slow hook delays every turn
  statement: A rule that must hold every time and that a script can check is a hook
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#hooks
  - docs/guide/hooks.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.fresh-context
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - own_context
      - true
    implies:
      concept: subagents
    pros:
    - Own context window; returns one result
    - Narrower tools or another model
    cons:
    - Costs more tokens
    - Each hand-off loses detail
  statement: Work that needs its own context, other tools or another model, such as a fresh-context review, is a subagent
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#subagents
  - docs/guide/subagents.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.guidance
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - guidance
    implies:
      concept: instructions
    pros:
    - Loaded into every session
    cons:
    - Costs context every session
    - Advisory, not enforcement
  statement: Short, stable guidance every session needs is an instruction file
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#instructions
  - docs/guide/instructions.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.user-procedure
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - job
        - procedure
      - any:
        - eq:
          - trigger
          - user
        - eq:
          - irreversible
          - true
    implies:
      concept: commands
    pros:
    - Only the user starts it
    - No catalog cost
    cons:
    - Not applied on the model's own initiative
  statement: A procedure with side effects or timing the model must not decide is a user-invoked skill
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  - docs/guide/commands.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.procedure
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - procedure
    implies:
      concept: skills
    pros:
    - Loaded only when needed
    - Can bundle tested scripts
    cons:
    - Occasional missed activation
    - Advisory, not enforcement
  statement: A recurring procedure or knowledge needed only sometimes is a skill
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  - docs/guide/skills.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.procedure-as-instructions
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - procedure
    implies:
      concept: instructions
    pros:
    - Always in context; cannot be missed
    cons:
    - Costs context in every session
  statement: A procedure can also live in the instruction file, as a pointer or a compressed index, when its omission would silently break output
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#instructions
  - docs/guide/instructions.md#when-to-use-it-and-when-not
  - docs/guide/skills.md#pointer-in-the-instruction-file-plus-skill
  contested: false
- id: selection.mechanism.setting
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - setting
    implies:
      concept: configuration
    pros:
    - Fixed precedence; stricter safety values win
    cons:
    - Settings files are not shared between harnesses
    - A pull request can change committed config
  statement: A harness setting goes into the configuration layer that owns it
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#configuration
  - docs/guide/configuration.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.access-control
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - access-control
    implies:
      concept: permissions-and-sandbox
    pros:
    - A deny in any scope wins in both leads
    cons:
    - Command patterns alone do not stop exfiltration
  statement: Allowing, asking or refusing actions is a permission rule
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#permissions-and-sandbox
  - docs/guide/permissions-and-sandbox.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.integration-cli
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - job
        - integration
      - eq:
        - external_system
        - cli
    implies:
      concept: skills
    pros:
    - The CLI stays inside the sandbox
    - Output can be filtered
    cons:
    - Needs a sandboxed shell
  statement: Access to a system with a known CLI is the CLI plus a skill
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  - docs/guide/skills.md#when-to-use-it-and-when-not
  - docs/overview.md#mcp
  contested: false
- id: selection.mechanism.integration
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - integration
    implies:
      concept: mcp
    pros:
    - Per-user OAuth and stateful integrations
    cons:
    - Runs outside the command sandbox
    - Every result passes through the context
  statement: Access to an external system without a usable CLI is an MCP server
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#mcp
  - docs/guide/mcp.md#when-to-use-it-and-when-not
  contested: false
- id: selection.mechanism.check
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - check
    implies:
      concept: hooks
    pros:
    - Runs every time at the event
