questions:
- id: target_set
  text: 'Which harnesses should run the result: Claude Code, Codex or both?'
  choices:
  - claude-code
  - codex
  - both
- id: reach
  text: 'Who uses it: this repository, all of your repositories, or the public?'
  choices:
  - repository
  - user
  - public
- id: plan_controls
  text: Are merge rules and required checks available on your hosting plan for this repository's visibility?
  choices:
  - available
  - unavailable
  - unknown
- id: opens_prs
  text: Will an agent open pull requests as part of this idea?
  choices:
  - true
  - false
- id: bypass_mode
  text: Will the agent run in a bypass or no-prompt mode?
  choices:
  - true
  - false
- id: untrusted_repo
  text: Will the agent work in repositories you do not trust?
  choices:
  - true
  - false
- id: lethal_trifecta
  text: Does the agent combine untrusted input with access to secrets and outbound network access?
  choices:
  - true
  - false
- id: job
  text: 'What is this part''s one job: standing guidance, a procedure, a harness setting, allowing or refusing actions, access to an external system, a check at an event, delegating a task, bundling a setup
    for others, running without a person, or a one-step task?'
  choices:
  - guidance
  - procedure
  - setting
  - access-control
  - integration
  - check
  - delegate
  - bundle
  - run-unattended
  - one-step
- id: event_without_agent
  text: Does the event happen without an agent, such as a merge, deploy, publish or credential scope?
  choices:
  - true
  - false
- id: must_survive_compromise
  text: Must it still hold if the agent is prompt-injected or its configuration is changed by a pull request?
  choices:
  - required
  - not-required
- id: who_disables
  text: 'Who may turn it off: the agent, any contributor, or only an admin?'
  choices:
  - agent
  - contributor
  - admin
- id: every_time
  text: Must it hold every time, or may the agent occasionally skip it?
  choices:
  - always
  - usually
- id: irreversible
  text: Is the action irreversible, about money, or does it publish or disclose data?
  choices:
  - true
  - false
- id: early_feedback
  text: Do you want earlier feedback than an outside gate gives?
  choices:
  - true
  - false
- id: trigger
  text: 'Who starts it: the user, the model, or an event?'
  choices:
  - user
  - model
  - event
- id: own_context
  text: Does it need its own context, other tools or another model?
  choices:
  - true
  - false
- id: external_system
  text: Does it reach an external system, and does a CLI exist for it?
  choices:
  - none
  - cli
  - no-cli
- id: own_model
  text: Does it need a model of its own, such as its own context window or another model, rather than only other tools?
  choices:
  - true
  - false
- id: script_checkable
  text: Can a script decide it without judgment?
  choices:
  - true
  - false
- id: hook_event
  text: 'At which hook event must it run, for example PreToolUse before a tool call, PostToolUse after one, UserPromptSubmit when a prompt is submitted, Stop when a turn ends, or PermissionRequest at an approval prompt?'
  choices:
  - PreToolUse
  - PostToolUse
  - PostToolUseFailure
  - PostToolBatch
  - PermissionRequest
  - PermissionDenied
  - UserPromptSubmit
  - UserPromptExpansion
  - Stop
  - SubagentStop
  - SubagentStart
  - SessionStart
  - SessionEnd
  - Setup
  - PreCompact
  - PostCompact
  - TaskCreated
  - TaskCompleted
  - TeammateIdle
  - Notification
  - StopFailure
  - ConfigChange
  - InstructionsLoaded
  - MessageDisplay
  - CwdChanged
  - FileChanged
  - DirectoryAdded
  - WorktreeCreate
  - WorktreeRemove
  - Elicitation
  - ElicitationResult
  - PreModelSwitch
  - PostModelSwitch
rules:
- id: selection.outcome.reuse
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - reuse_confirmed
      - true
    implies:
      outcome: reuse
  statement: A researched existing solution with confirmed fit, license and maintenance is reused instead of built
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/skills.md#security
  - docs/best-practices/skills.md#security
  contested: false
- id: selection.outcome.one-step
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - job
      - one-step
    implies:
      outcome: nothing-fits
  statement: A one-step task the model handles alone needs no mechanism
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  - docs/guide/skills.md#when-to-use-it-and-when-not
  contested: false
- id: selection.outcome.guarantee-unavailable
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - any:
        - eq:
          - must_survive_compromise
          - required
        - eq:
          - who_disables
          - admin
        - eq:
          - event_without_agent
          - true
      - eq:
        - plan_controls
        - unavailable
    implies:
      outcome: nothing-fits
  statement: A guarantee that needs an outside control unavailable on the user's plan is reported as nothing fits
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  - docs/guide/outside-gates.md#seven-conditions-turn-a-control-into-a-gate
  contested: false
- id: selection.outcome.event-with-feedback
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - event_without_agent
        - true
      - eq:
        - early_feedback
        - true
    implies:
      outcome: outside-alongside
  statement: An event that happens without an agent needs an outside gate; wanted earlier feedback adds an advisory harness mirror
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.outcome.event-without-agent
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - event_without_agent
      - true
    implies:
      outcome: outside-instead
  statement: An event that happens without an agent is enforced by an outside gate; a harness build adds no enforcement
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.outcome.guarantee
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      any:
      - eq:
        - must_survive_compromise
        - required
      - eq:
        - who_disables
        - admin
      - eq:
        - irreversible
        - true
    implies:
      outcome: outside-alongside
  statement: A rule that must survive a compromised agent, that only an admin may turn off, or that guards an irreversible action needs an outside control alongside the harness mechanism
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.outcome.harness-only
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      in:
      - job
      - - guidance
        - procedure
        - setting
        - access-control
        - integration
        - check
        - delegate
        - bundle
        - run-unattended
    implies:
      outcome: harness-only
  statement: Otherwise a harness mechanism alone fits
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/guide/outside-gates.md#four-outcomes-from-six-intake-questions
  contested: false
- id: selection.eligibility.must-hold-instructions
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: instructions
  statement: Instructions cannot guarantee a rule that must hold every time; they are context, not enforcement
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#instructions
  contested: false
- id: selection.eligibility.must-hold-skills
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: skills
  statement: A skill cannot guarantee a rule that must hold every time
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  - docs/guide/skills.md#when-to-use-it-and-when-not
  contested: false
- id: selection.eligibility.must-hold-commands
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: commands
  statement: A user-invoked skill cannot guarantee a rule that must hold every time
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  contested: false
- id: selection.eligibility.must-hold-subagents
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: subagents
  statement: Delegation is a model decision, so a subagent cannot guarantee a check that must always run
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#subagents
  contested: false
- id: selection.eligibility.must-hold-automation
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: automation
  statement: Running the agent unattended does not make a rule hold on every tool call
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#automation
  contested: false
- id: selection.eligibility.judgment-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - script_checkable
        - false
      - in:
        - target_set
        - - codex
          - both
    implies:
      excludes: hooks
  statement: 'Portable hook handlers are commands and MCP tool calls, which cannot judge; judgment hooks (prompt, agent) are Claude Code only'
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#hooks
  - docs/guide/hooks.md#when-to-use-it-and-when-not
  contested: false
- id: selection.eligibility.hard-limit-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - job
        - access-control
      - eq:
        - every_time
        - always
    implies:
      excludes: hooks
  statement: A hard limit on reading, writing or network access needs permissions and the sandbox; tool switching and unhooked paths bypass hooks
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#hooks
  contested: false
- id: selection.eligibility.model-started-commands
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - job
        - procedure
      - eq:
        - trigger
        - model
    implies:
      excludes: commands
  statement: A procedure the model should start on its own cannot be a user-invoked skill
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  contested: false
- id: selection.eligibility.side-effects-skills
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - irreversible
      - true
    implies:
      excludes: skills
  statement: The model must not decide on its own to run an irreversible or publishing procedure, so a model-invoked skill does not fit
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  - docs/guide/skills.md#user-invoked-skill
  contested: false
- id: selection.eligibility.must-hold-mcp
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - every_time
      - always
    implies:
      excludes: mcp
  statement: The model may not call an MCP tool, so an MCP server cannot make a step hold every time
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#mcp
  contested: false
- id: selection.eligibility.own-model-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - eq:
        - own_context
        - true
      - eq:
        - own_model
        - true
      - in:
        - target_set
        - - codex
          - both
    implies:
      excludes: hooks
  statement: Portable hook handlers are commands and MCP tool calls; a separate process gives no model of its own, and prompt and agent hooks are Claude Code only
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/guide/hooks.md#comparison
  - docs/guide/hooks.md#when-to-use-it-and-when-not
  contested: false
- id: selection.eligibility.model-handler-event-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - any:
        - eq:
          - script_checkable
          - false
        - all:
          - eq:
            - own_context
            - true
          - eq:
            - own_model
            - true
      - not:
          in:
          - hook_event
          - - PreToolUse
            - PostToolUse
            - PostToolBatch
            - PostToolUseFailure
            - UserPromptSubmit
            - UserPromptExpansion
            - Stop
            - SubagentStop
            - TaskCreated
            - TaskCompleted
            - TeammateIdle
    implies:
      excludes: hooks
  statement: A prompt or agent hook's verdict takes effect only at events whose ok false blocks or feeds back; elsewhere the handler does not run or its verdict has no effect
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/vendors/claude-code/hooks.md#prompt-and-agent-hooks
  - docs/vendors/claude-code/hooks.md#handler-types-and-support-by-event
  contested: false
- id: selection.eligibility.claude-code-only-event-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - in:
        - target_set
        - - codex
          - both
      - not:
          in:
          - hook_event
          - - SessionStart
            - UserPromptSubmit
            - PreToolUse
            - PermissionRequest
            - PostToolUse
            - PreCompact
            - PostCompact
            - SubagentStart
            - SubagentStop
            - Stop
            - SessionEnd
    implies:
      excludes: hooks
  statement: Codex shares only eleven hook events with Claude Code; a hook on any other event does not run in Codex
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/guide/hooks.md#generalized-model
  - docs/guide/hooks.md#portability
  contested: false
- id: selection.eligibility.no-decision-event-hooks
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      all:
      - any:
        - eq:
          - job
          - check
        - eq:
          - every_time
          - always
      - in:
        - hook_event
        - - SessionStart
          - Setup
          - Notification
          - SubagentStart
          - StopFailure
          - InstructionsLoaded
          - MessageDisplay
          - PermissionDenied
          - PostCompact
          - SessionEnd
          - CwdChanged
          - FileChanged
          - DirectoryAdded
          - PostModelSwitch
    implies:
      excludes: hooks
  statement: A check must take effect, and a hook at an event without decision control can neither block nor feed back
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/vendors/claude-code/hooks.md#decision-control-by-event
  - docs/guide/hooks.md#generalized-model
  contested: false
- id: selection.eligibility.side-effects-instructions
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - irreversible
      - true
    implies:
      excludes: instructions
  statement: Instructions are context the model acts on by its own decision, so they cannot keep it from starting an irreversible or publishing procedure on its own
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/overview.md#commands
  - docs/overview.md#instructions
  contested: false
- id: selection.eligibility.side-effects-subagents
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - irreversible
      - true
    implies:
      excludes: subagents
  statement: Delegation starts on the model's decision, or on instructions or a skill it follows, so a subagent cannot keep an irreversible or publishing procedure from starting without the user
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/overview.md#subagents
  - docs/overview.md#commands
  contested: false
- id: selection.eligibility.own-context-skills
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - own_context
      - true
    implies:
      excludes: skills
  statement: A skill runs in the session's context; work that needs its own context belongs in a subagent, which can use skills
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#skills
  contested: false
- id: selection.eligibility.own-context-commands
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - own_context
      - true
    implies:
      excludes: commands
  statement: A command is a user-invoked skill and runs in the session's context; work that needs its own context belongs in a subagent
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Vendor
  sources:
  - docs/overview.md#commands
  - docs/overview.md#skills
  contested: false
- id: selection.eligibility.own-context-instructions
  concept: selection
  kind: should
  severity: warning
  check: script
  checker: selection.match
  params:
    when:
      eq:
      - own_context
      - true
    implies:
      excludes: instructions
  statement: Instructions load into the session's own context, so they cannot give work a context, tools or model of its own
  applies_to:
    harnesses:
    - claude-code
    - codex
  evidence: Inference
  sources:
  - docs/overview.md#instructions
  - docs/overview.md#subagents
  contested: false
- id: selection.eligibility.event-started-skills
  concept: selection
  kind: should
