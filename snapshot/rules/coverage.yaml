  - section: anti-patterns
    items:
    - text: Vague or first-person descriptions; workflow steps; when-to-use only in the body
      rules:
      - skills.description.what-and-when
      - skills.description.voice
      - skills.description.no-workflow-steps
    - text: Explaining what the model knows; menus of options
      rules:
      - skills.body.only-what-model-lacks
      - skills.body.strictness-matches-fragility
    - text: Nested references; duplicated content; README or CHANGELOG
      rules:
      - skills.references.one-level
      - skills.references.load-conditions
      - skills.package.no-auxiliary-docs
    - text: Time-bound statements
