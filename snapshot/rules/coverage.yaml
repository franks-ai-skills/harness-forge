# Every swept section and item: the rules it became, or why it is not a rule.
# Extracted 2026-10-09.
pages:
- page: docs/guide/skills.md
  sections:
  - section: comparison
    items:
    - text: Harness comparison table
      status: not-a-rule
      reason: Reference facts about the harness; the rules that depend on them cite this section.
  - section: generalized-model
    items:
    - text: Skill package, frontmatter, roots, catalog, lifecycle and invocation policy
      status: not-a-rule
      reason: Reference facts about the harness; the rules that depend on them cite this section.
  - section: when-to-use-it-and-when-not
    items:
    - text: Use and do-not-use table
      status: not-a-rule
      reason: Mechanism selection, not a property of a built skill; rules/selection.yaml encodes it (plan
        task 6).
  - section: approaches
    items:
    - text: Overview of the approaches below
      status: not-a-rule
      reason: Reference facts about the harness; the rules that depend on them cite this section.
  - section: model-invoked-skill
    items:
    - text: Activation depends entirely on the description
      rules:
      - skills.description.what-and-when
  - section: user-invoked-skill
    items:
    - text: Side-effecting skills are user-invoked with both flags
      rules:
      - skills.invocation.side-effects-user-invoked
      - skills.invocation.both-flags
  - section: pointer-in-the-instruction-file-plus-skill
    items:
    - text: Pointer or compressed index for knowledge whose omission is silent
      status: not-a-rule
      reason: Mechanism selection, not a property of a built skill; rules/selection.yaml encodes it (plan
        task 6).
  - section: script-backed-skill
    items:
    - text: Deterministic operations go into scripts built for an agent caller
      rules:
      - skills.scripts.agent-caller
  - section: skill-that-delegates-to-a-subagent
    items:
    - text: 'context: fork and naming a subagent in the body'
      status: dropped
      reason: Claude Code-only feature or a subagent build; subagent builders are outside this slice.
  - section: distribution-and-scope
    items:
    - text: Skills needed by CI or cloud runs are committed
      rules:
      - skills.scope.committed-for-automation
    - text: One canonical copy symlinked into the other root
      rules:
      - skills.portable.layout
  - section: practices
    items:
    - text: 1. Write a skill only where it adds what the model lacks
      status: not-a-rule
      reason: Process advice about whether to build; not observable in the built files. The intake's selection
        asks whether a skill is needed.
    - text: 2. Write the description as the trigger condition
      rules:
      - skills.description.what-and-when
      - skills.description.no-workflow-steps
      - skills.description.boundary
      - skills.description.voice
      - skills.description.concise
      - skills.description.length
    - text: 3. Keep SKILL.md lean and put gotchas first
      rules:
      - skills.body.size
      - skills.body.only-what-model-lacks
      - skills.body.gotchas-first
      - skills.package.no-auxiliary-docs
    - text: 4. Disclose detail progressively with explicit triggers
      rules:
      - skills.references.one-level
      - skills.references.load-conditions
      - skills.references.resolve
    - text: 5. Match strictness to fragility
      rules:
      - skills.body.strictness-matches-fragility
    - text: 6. Put deterministic logic in tested scripts built for an agent caller
      rules:
      - skills.scripts.agent-caller
    - text: 7. Explain the why before adding hard rules
      rules:
      - skills.body.reasons-before-hard-rules
    - text: 8. Make side-effecting skills user-invoked in both leads, and read inputs from the message
      rules:
      - skills.invocation.side-effects-user-invoked
      - skills.invocation.both-flags
      - skills.inputs.from-message
    - text: 9. Write evals first and test triggering and behavior separately
      status: not-a-rule
      reason: 'Process advice; not observable in the built files. Forge''s runtime activation tests are
        narrower: they check that the built skill activates, and they replace neither a no-skill baseline
        nor behavior evaluation.'
    - text: 10. Ground skills in human domain knowledge
      status: not-a-rule
      reason: Process advice about authoring; not observable in the built files. Forge's deep research
        supplies sourced domain requirements.
    - text: 11. Keep the library small and curated
      status: not-a-rule
      reason: Applies to a whole skill library, not to one built skill.
    - text: 12. Move rules that must hold every time into hooks
      rules:
      - skills.goal.no-must-hold-rule-in-skill
  - section: security
    items:
    - text: Third-party skills are code and prompt injection with the user's privileges
      rules:
      - skills.reuse.reviewed-and-pinned
      - skills.security.no-surprising-content
    - text: Repository skills grant tools without trust
      rules:
      - skills.security.allowed-tools-least-privilege
  - section: cross-concept-checks
    items:
    - text: Connect the skill to the security guide's boundaries
      rules:
      - security.helpers.confined
      - security.untrusted-input.as-data
  - section: verification-and-checklist
    items:
    - text: name is spec-valid and equals the directory name
      rules:
      - skills.name.format
    - text: description states what, Use when and a boundary; key words first; no workflow steps
      rules:
      - skills.description.what-and-when
      - skills.description.boundary
      - skills.description.no-workflow-steps
    - text: SKILL.md under 500 lines; references one level deep with load conditions
      rules:
      - skills.body.size
      - skills.references.one-level
      - skills.references.load-conditions
    - text: Scripts are non-interactive, bounded, with --help, clear errors and --dry-run
      rules:
      - skills.scripts.agent-caller
    - text: Side-effecting skills set both lead flags
      rules:
      - skills.invocation.side-effects-user-invoked
      - skills.invocation.both-flags
    - text: Shared skills use only portable frontmatter; one canonical copy is symlinked
      rules:
      - skills.portable.frontmatter
      - skills.portable.layout
    - text: Skills needed by CI or cloud runs are committed
      rules:
      - skills.scope.committed-for-automation
    - text: Every third-party skill was read in full and pinned
      rules:
      - skills.reuse.reviewed-and-pinned
    - text: No-skill baseline, trigger and behavior evals; catalog fits both budgets
      status: not-a-rule
      reason: 'Process advice; not observable in the built files. Forge''s runtime activation tests are
        narrower: they check that the built skill activates, and they replace neither a no-skill baseline
        nor behavior evaluation. Catalog size applies to a whole library.'
    - text: Structure validators, discovery and headless trigger checks
      status: not-a-rule
      reason: Verification tooling, not a property of the files.
  - section: portability
    items:
    - text: Directory layout with one canonical copy and a symlink
      rules:
      - skills.portable.layout
    - text: Portable frontmatter table
      rules:
      - skills.frontmatter.valid
      - skills.name.format
      - skills.description.length
      - skills.portable.frontmatter
    - text: 'Traps: both flags, no placeholders, cloud runs ignore user scope'
      rules:
      - skills.invocation.both-flags
      - skills.portable.no-claude-placeholders
      - skills.scope.committed-for-automation
    - text: OpenCode sees two copies; script pre-approval; versioning
      status: not-a-rule
      reason: Harness facts without a checkable property for Claude Code and Codex builds.
  - section: dropped-from-the-generalization
    items:
    - text: Harness-only features stay out of shared skills
      rules:
      - skills.portable.frontmatter
      - skills.portable.no-claude-placeholders
  - section: open-questions
    items:
    - text: Open questions
      status: not-a-rule
      reason: Open questions record gaps; no practice to check.
  - section: sources
    items:
    - text: Sources
      status: not-a-rule
      reason: List of sources; no practice to check.
