      - skills.body.no-time-bound-statements
    - text: Scripts that prompt, dump output or fail without guidance
      rules:
      - skills.scripts.agent-caller
    - text: Claude-only placeholders in shared skills; model-invocable side effects
      rules:
      - skills.portable.no-claude-placeholders
      - skills.invocation.side-effects-user-invoked
    - text: ALL-CAPS rules
      rules:
      - skills.body.reasons-before-hard-rules
    - text: Third-party skills read only partly; must-hold rules only in skill text
      rules:
      - skills.reuse.reviewed-and-pinned
      - skills.goal.no-must-hold-rule-in-skill
    - text: Backslash paths and @path links to other skills
      status: not-a-rule
      reason: Covered only as judged advice in practice 4; no separate rule, because the reference checker
        already rejects links that do not resolve.
    - text: Keywords from failed queries; model-generated skills; large libraries; judging triggers by
        eye
      status: not-a-rule
      reason: Process and library-level advice; not observable in one built skill.
