      status: not-a-rule
      reason: Anthropic-specific naming preference for uploads; no evidence that it affects Claude Code
        or Codex builds.
    - text: Fixing false triggers and over-triggering
      status: not-a-rule
      reason: Iteration advice for evaluating triggers; not a property of one version of the files.
  - section: 3-keep-skillmd-lean-and-put-gotchas-first
